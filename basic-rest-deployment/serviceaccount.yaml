apiVersion: v1
kind: ServiceAccount
metadata:
  name: basic-rest-sa
  labels:
    app: basic-rest-sa
  annotations:
    # IRSA: links this ServiceAccount to the IAM role that may read the secret.
    # Replace with the role ARN returned by Cloud Operations. Ignored outside EKS.
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/basic-rest-secrets-role
